name: office365-connector
version: 3.0.1
description: |
  Office 365 / Outlook connector for Hermes Agent. Provides email (read/send),
  calendar (read/write), and contact-aware tools backed by Microsoft Graph,
  with multi-account support and OAuth 2.0 device-code authentication.

provides_tools:
  - office365_accounts_list
  - office365_accounts_add
  - office365_accounts_remove
  - office365_accounts_set_default
  - office365_accounts_import_legacy
  - office365_auth_login
  - office365_auth_login_poll
  - office365_auth_status
  - office365_auth_diag
  - office365_email_recent
  - office365_email_search
  - office365_email_from_sender
  - office365_email_read
  - office365_email_send
  - office365_email_reply
  - office365_calendar_today
  - office365_calendar_week
  - office365_calendar_range
  - office365_calendar_cancel_event

requires_env:
  - name: AZURE_TENANT_ID
    description: "Azure AD tenant ID (UUID). Optional once accounts are registered via office365_accounts_add."
    url: "https://learn.microsoft.com/en-us/azure/active-directory/develop/quickstart-register-app"
    secret: false
  - name: AZURE_CLIENT_ID
    description: "Azure App Registration client ID (UUID). Optional once accounts are registered."
    url: "https://learn.microsoft.com/en-us/azure/active-directory/develop/quickstart-register-app"
    secret: false
  - name: AZURE_CLIENT_SECRET
    description: "Azure App Registration client secret. Optional once accounts are registered; never passed on argv."
    url: "https://learn.microsoft.com/en-us/azure/active-directory/develop/quickstart-register-app"
    secret: true
